[pytest]
pythonpath = .
testpaths = tests
markers =
    eval_full: the full claim-verification pass -- dataset reproducibility (byte-identical
        regeneration), seed-stability (the eval re-run across 8 seeds), and the confusion-
        matrix/false-clear checks, in addition to the fast unit/integration suite. Slower
        (~10-20s) because it regenerates and scores several 150-300 invoice datasets rather
        than reading fixtures. Included in a plain `pytest` run; select on its own with
        `pytest -m eval_full -v`. See EVAL_METHODOLOGY.md.
